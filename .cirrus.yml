# Attention: if you submit an improvement for a Namecoin Cirrus config, please
# file a GitHub issue about it at the namecoin/meta repo, so that we can make
# sure it propagates to all the other Namecoin repos.  Thanks!

task:
  alias: Go Lint
  container:
    image: golangci/golangci-lint:latest
  install_script:
    - apt-get update
    - apt-get install -y libcap-dev
  path_script:
    - source testdata/move_to_gopath.bash
  systemd_script:
    - mkdir -p $(go env GOPATH)/src/github.com/coreos
    - cd $(go env GOPATH)/src/github.com/coreos
    - git clone https://github.com/coreos/go-systemd.git
  kingpin_script:
    - mkdir -p $(go env GOPATH)/src/github.com/alecthomas
    - cd $(go env GOPATH)/src/github.com/alecthomas
    - git clone https://github.com/alecthomas/kingpin.git
  fetch_script:
    - cd $(go env GOPATH)/src/github.com/"$CIRRUS_REPO_FULL_NAME"
    - go mod init github.com/"$CIRRUS_REPO_FULL_NAME"
    - go mod edit -replace github.com/coreos/go-systemd=$(go env GOPATH)/src/github.com/coreos/go-systemd
    - go mod edit -replace gopkg.in/alecthomas/kingpin.v2=$(go env GOPATH)/src/github.com/alecthomas/kingpin
    - go mod tidy
  lint_script:
    - cd $(go env GOPATH)/src/github.com/$CIRRUS_REPO_FULL_NAME/
    # nosnakecase complains about stdlib API's that we can't change.
    - golangci-lint run $GOLANGCI_ARGS -v --timeout 5m --output.json.path $CIRRUS_WORKING_DIR/lint-report.json
  # Not running "copyloopvar" linter because it needs Go 1.22+, which isn't supported yet in gccgo 14 (Go 1.16-1.18), which is what Debian Trixie/Stable uses.
  # Not running "depguard" linter because it looks too niche.
  # Not running "exhaustruct" linter because it looks too niche.
  # Not running "gosmopolitan" linter because it's not aimed at English-language code.
  # Not running "intrange" linter because it needs Go 1.22+, which isn't supported yet in gccgo 14 (Go 1.16-1.18), which is what Debian Trixie/Stable uses.
  matrix:
    - name: "Go Lint $GOOS New"
      env:
        GOLANGCI_ARGS: "--new-from-rev=HEAD~ --enable=cyclop,err113,forcetypeassert,funlen,gocognit,goconst,gocritic,gosec,mnd,modernize,nlreturn,wsl_v5"
    - name: "Go Lint $GOOS Mandatory"
      env:
        # TODO: Re-enable dupword after ncdns issue #166 is fixed.
        # TODO: Re-enable varnamelen after golangci-lint v1.44 is released.
        GOLANGCI_ARGS: "--enable=asasalint,asciicheck,bidichk,bodyclose,canonicalheader,decorder,dupl,dupword,durationcheck,embeddedstructfieldcheck,errcheck,errchkjson,errname,exhaustive,exptostd,gocheckcompilerdirectives,godoclint,godot,goprintffuncname,govet,ineffassign,misspell,nakedret,predeclared,staticcheck,unconvert,unparam,unused,usestdlibvars,wastedassign"
    - name: "Go Lint $GOOS"
      env:
        GOLANGCI_ARGS: "--enable=cyclop,err113,forcetypeassert,funlen,gocognit,goconst,gocritic,gosec,mnd,modernize,nlreturn,wsl_v5"
      allow_failures: true
  matrix:
    - env:
        GOOS: linux
    - env:
        GOOS: windows
  always:
    golangci_artifacts:
      path: lint-report.json
      type: text/json
      format: golangci

task:
  name: ShellCheck
  container:
    image: fedora:latest
    cpu: 1
    memory: 1G
  install_script: dnf install -y ShellCheck
  lint_script: bash testdata/shellcheck.bash

task:
  name: "Unit Tests $CONTAINER_NAME"
  alias: Unit Tests
  matrix:
    - env:
        GO_VERSION: latest
        CONTAINER_NAME: "Go $GO_VERSION"
      container:
        image: golang:$GO_VERSION
      install_script:
        - apt-get update
        - apt-get install -y libcap-dev
    - env:
        CONTAINER_NAME: "Fedora latest"
      container:
        image: fedora:latest
      install_script:
        - dnf install -y golang libcap-devel
  path_script:
    - source testdata/move_to_gopath.bash
  systemd_script:
    - mkdir -p $(go env GOPATH)/src/github.com/coreos
    - cd $(go env GOPATH)/src/github.com/coreos
    - git clone https://github.com/coreos/go-systemd.git
  kingpin_script:
    - mkdir -p $(go env GOPATH)/src/github.com/alecthomas
    - cd $(go env GOPATH)/src/github.com/alecthomas
    - git clone https://github.com/alecthomas/kingpin.git
  fetch_script:
    - cd $(go env GOPATH)/src/github.com/"$CIRRUS_REPO_FULL_NAME"
    - go mod init github.com/"$CIRRUS_REPO_FULL_NAME"
    - go mod edit -replace github.com/coreos/go-systemd=$(go env GOPATH)/src/github.com/coreos/go-systemd
    - go mod edit -replace gopkg.in/alecthomas/kingpin.v2=$(go env GOPATH)/src/github.com/alecthomas/kingpin
    - go mod tidy
    # Get the test suite
    - mkdir -p $(go env GOPATH)/src/github.com/hlandau
    - cd $(go env GOPATH)/src/github.com/hlandau
    - git clone https://github.com/hlandau/nctestsuite.git
  test_script:
    - cd $(go env GOPATH)/src/github.com/"$CIRRUS_REPO_FULL_NAME"
    - go install -tags "$GOX_TAGS" -v ./...
    - export GOPATH=$(go env GOPATH)
    - go test -tags "$GOX_TAGS" -v github.com/$CIRRUS_REPO_FULL_NAME/...
  env:
    GOX_TAGS: ""

task:
  name: "Functional Tests $CI_DISTRO Go $GO_VERSION"
  alias: "Functional Tests"
  matrix:
    - compute_engine_instance:
        image_project: debian-cloud
        image: family/debian-11
        platform: linux
        cpu: 1
        memory: 1G
      env:
        CI_DISTRO: debian
    - compute_engine_instance:
        image_project: cirrus-images
        image: family/docker-builder
        platform: linux
        cpu: 1
        memory: 1G
      env:
        CI_DISTRO: ubuntu
  bitcoind_cache:
    folder: /tmp/bitcoind
    populate_script: mkdir -p /tmp/bitcoind
  install_script:
    - apt-get update
    # bind9-dnsutils contains dig
    - apt-get install -y dnssec-trigger bind9-dnsutils
    # Namecoin Core
    # Temporarily downgrade Namecoin Core until deterministic salts with descriptor wallets are fixed.
    #- BITCOIND_URL=$(curl https://www.namecoin.org/download/ | grep x86_64-linux-gnu.tar.gz | grep -v 0.13.99 | grep --only-matching https://.*.tar.gz)
    - BITCOIND_URL="https://www.namecoin.org/files/namecoin-core/namecoin-core-22.0/namecoin-nc22.0-x86_64-linux-gnu.tar.gz"
    - BITCOIND_FILENAME=$(echo $BITCOIND_URL | grep -E --only-matching 'namecoin-nc.*.tar.gz')
    - BITCOIND_PATH=/tmp/bitcoind/$BITCOIND_FILENAME
    - tar -xaf $BITCOIND_PATH || (rm -f /tmp/bitcoind/* && curl --output $BITCOIND_PATH $BITCOIND_URL && tar -xaf $BITCOIND_PATH)
    - cp -a namecoin-*/* /usr/
    # ncdns
    - NCDNS_URL=https://api.cirrus-ci.com/v1/artifact/build/$CIRRUS_BUILD_ID/Cross-Compile%20Go%20$GO_VERSION/binaries/dist/ncdns--linux_amd64.tar.gz
    - curl -o ncdns.tar.gz $NCDNS_URL
    - tar -xaf ncdns.tar.gz
    - cp -a ncdns--*/* /usr/
    # Configure DNSSEC-Trigger
    - cp _doc/unbound.conf.d/ncdns.conf _doc/unbound.conf.d/ncdns-insecure.conf /etc/unbound/unbound.conf.d
    - systemctl restart unbound
  bitcoind_service_background_script:
    - testdata/run_bitcoind.sh
  ncdns_service_background_script:
    # ncdns refuses to run as root
    - adduser ncdns --disabled-password
    - ncdns -conf testdata/ncdns.conf
  regtest_script:
    - sleep 10s
    - testdata/regtest.sh
  depends_on:
    - "Cross-Compile Go $GO_VERSION"
  env:
    GO_VERSION: latest

task:
  name: "Cross-Compile Go $GO_VERSION"
  alias: Cross-Compile
  container:
    image: golang:$GO_VERSION
    cpu: 8
    memory: 8G
  install_script:
    - dpkg --add-architecture i386
    - dpkg --add-architecture armhf
    - dpkg --add-architecture arm64
    # TODO: Support cgo for ppc64.
    - dpkg --add-architecture ppc64el
    - apt-get update
    - apt-get install -y gcc-multilib libcap-dev libc6-dev:i386 libcap-dev:i386 libc6-dev:armhf libcap-dev:armhf libc6-dev:arm64 libcap-dev:arm64 libc6-dev:ppc64el libcap-dev:ppc64el
  path_script:
    - source testdata/move_to_gopath.bash
  gox_script:
    - go install github.com/mitchellh/gox@latest
  systemd_script:
    - mkdir -p $(go env GOPATH)/src/github.com/coreos
    - cd $(go env GOPATH)/src/github.com/coreos
    - git clone https://github.com/coreos/go-systemd.git
  kingpin_script:
    - mkdir -p $(go env GOPATH)/src/github.com/alecthomas
    - cd $(go env GOPATH)/src/github.com/alecthomas
    - git clone https://github.com/alecthomas/kingpin.git
  fetch_script:
    - cd $(go env GOPATH)/src/github.com/"$CIRRUS_REPO_FULL_NAME"
    - go mod init github.com/"$CIRRUS_REPO_FULL_NAME"
    - go mod edit -replace github.com/coreos/go-systemd=$(go env GOPATH)/src/github.com/coreos/go-systemd
    - go mod edit -replace gopkg.in/alecthomas/kingpin.v2=$(go env GOPATH)/src/github.com/alecthomas/kingpin
    - go mod tidy
  build_script:
    - rm -rf idist
    - cd $(go env GOPATH)/src/github.com/"$CIRRUS_REPO_FULL_NAME"
    - CGO_ENABLED=1 gox -tags="$GOX_TAGS" -parallel=8 -osarch 'linux/386 linux/amd64 linux/arm linux/arm64 linux/ppc64le' -output "$GOPATH/releasing/idist/$CIRRUS_REPO_NAME-$CIRRUS_TAG-{{.OS}}_{{.Arch}}/bin/{{.Dir}}" ./...
    - CGO_ENABLED=0 gox -tags="$GOX_TAGS" -parallel=8 -osarch 'darwin/amd64 freebsd/386 freebsd/amd64 freebsd/arm linux/ppc64 openbsd/386 openbsd/amd64 netbsd/386 netbsd/amd64 netbsd/arm dragonfly/amd64 solaris/amd64 windows/386 windows/amd64' -output "$GOPATH/releasing/idist/$CIRRUS_REPO_NAME-$CIRRUS_TAG-{{.OS}}_{{.Arch}}/bin/{{.Dir}}" ./...
  dist_script:
    - mv $GOPATH/releasing/idist ./idist
    - bash "testdata/dist.bash"
  binaries_artifacts:
    path: "dist/*"
  env:
    GOX_TAGS: ""
    GO_VERSION: latest

task:
  # GitHub Release Upload
  # TODO: implement this.
  name: GitHub Release
  container:
    image: golang:latest
    cpu: 1
    memory: 1G
  depends_on:
    - Go Lint
    - ShellCheck
    - Unit Tests
    - Cross-Compile
    - Functional Tests
  bin_cache:
    folder: "idist"
    fingerprint_script:
      - "echo cross_compile_bin_go_%GO_VERSION%"
    reupload_on_changes: false
    populate_script:
      - "mkdir idist"
  install_script:
    - go get github.com/tcnksm/ghr
  release_script:
    - bash "testdata/release.bash"
  allow_failures: true
  env:
    GOX_TAGS: ""
    GO_VERSION: latest

